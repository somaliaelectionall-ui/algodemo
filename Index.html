<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Somnexus × Algorand × SmartVista — Advanced MVP Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f8f9fa;--bg3:#f1f3f5;
  --text:#1a1a2e;--text2:#4a5568;--text3:#9ba3af;
  --bdr:rgba(0,0,0,0.1);--bdr2:rgba(0,0,0,0.18);
  --info-bg:#e8f4fd;--info:#1a6fad;--info-bdr:rgba(26,111,173,0.3);
  --ok-bg:#e8f8f0;--ok:#1a7f4b;--ok-bdr:rgba(26,127,75,0.3);
  --warn-bg:#fff8e1;--warn:#b45309;--warn-bdr:rgba(180,83,9,0.3);
  --err-bg:#fde8e8;--err:#b91c1c;--err-bdr:rgba(185,28,28,0.3);
  --purple-bg:#f3f0ff;--purple:#5b21b6;--purple-bdr:rgba(91,33,182,0.3);
  --teal-bg:#e0f7f4;--teal:#0d6e6e;--teal-bdr:rgba(13,110,110,0.3);
  --r:8px;--rl:12px
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg3);color:var(--text);font-size:14px;min-height:100vh}
button{cursor:pointer;border:0.5px solid var(--bdr2);background:var(--bg);color:var(--text);border-radius:var(--r);padding:6px 14px;font-size:13px;font-family:inherit;transition:background 0.15s}
button:hover{background:var(--bg2)} button:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse} th{font-weight:500;text-align:left}
.tbl-hd{padding:8px 12px;font-size:11px;color:var(--text2);border-bottom:0.5px solid var(--bdr);background:var(--bg2)}
.tbl-td{padding:10px 12px;font-size:12px}
.tbl-row{border-bottom:0.5px solid var(--bdr)}
.tbl-row:hover{background:var(--bg2)}
.card{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.card-hd{padding:12px 16px;border-bottom:0.5px solid var(--bdr);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.card-bd{padding:16px 20px}
.metric{background:var(--bg2);border-radius:var(--r);padding:12px 14px}
.metric-lbl{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.metric-val{font-size:22px;font-weight:500}
.pill{font-size:10px;padding:2px 8px;border-radius:20px;border:0.5px solid var(--bdr);display:inline-block;white-space:nowrap}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.nav-item{padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;transition:all 0.15s}
.nav-item.active{border-left-color:var(--info);background:var(--info-bg)}
.nav-item:hover:not(.active){background:var(--bg3)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:0.5px solid var(--bdr);background:var(--bg);position:sticky;top:0;z-index:10}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:204px;border-right:0.5px solid var(--bdr);background:var(--bg2);flex-shrink:0;padding-top:8px}
.content{flex:1;padding:20px;overflow-y:auto;min-width:0}

/* PHONE FRAME */
.phone{width:280px;border:1.5px solid var(--bdr2);border-radius:20px;overflow:hidden;background:var(--bg);flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.phone-status{background:var(--text);color:#fff;padding:4px 14px;font-size:10px;display:flex;justify-content:space-between;align-items:center}
.phone-appbar{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:0.5px solid var(--bdr)}
.phone-body{padding:0;min-height:380px;display:flex;flex-direction:column}
.phone-tabbar{border-top:0.5px solid var(--bdr);display:flex;background:var(--bg)}
.tab-btn{flex:1;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:transparent;font-size:9px;color:var(--text3)}
.tab-btn.active-tab{color:var(--info)}

/* TIMELINE */
.timeline{display:flex;gap:0;padding:10px 20px;background:var(--bg);border-bottom:0.5px solid var(--bdr);overflow-x:auto;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.tl-step{display:flex;align-items:center;flex-shrink:0}
.tl-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;border:0.5px solid var(--bdr2);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all 0.2s;flex-shrink:0}
.tl-dot.tl-active{background:var(--info);border-color:var(--info);color:#fff}
.tl-dot.tl-done{background:var(--ok-bg);border-color:var(--ok-bdr);color:var(--ok)}
.tl-label{font-size:9px;color:var(--text3);margin-top:3px;text-align:center;max-width:60px}
.tl-item{display:flex;flex-direction:column;align-items:center;gap:0}
.tl-line{width:18px;height:1px;background:var(--bdr2);margin-top:-14px;flex-shrink:0}

/* ANIMATIONS */
@keyframes scan-line{0%{top:4px}50%{top:calc(100% - 4px)}100%{top:4px}}
@keyframes ripple-nfc{0%{transform:scale(0.6);opacity:0.8}100%{transform:scale(3);opacity:0}}
@keyframes slide-r{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fade-up{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.25}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes dot-fill{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes coin-move{0%{transform:translateX(0);opacity:1}100%{transform:translateX(200px);opacity:0}}
@keyframes balance-up{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
@keyframes check-pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.scan-bar{position:absolute;left:0;right:0;height:2px;background:var(--info);animation:scan-line 1.4s linear infinite;opacity:0.8}
.nfc-ring{position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--info-bdr);animation:ripple-nfc 1.2s ease-out infinite}
.nfc-ring2{position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--info-bdr);animation:ripple-nfc 1.2s ease-out 0.5s infinite}
.slide-r{animation:slide-r 0.35s ease forwards}
.fade-up{animation:fade-up 0.3s ease forwards}
.shake{animation:shake 0.45s ease}
.pulse{animation:pulse-dot 1.6s ease infinite}
.spin{animation:spin 1s linear infinite}
.check-pop{animation:check-pop 0.4s ease forwards}

/* ALGO BRAND */
.algo-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--purple-bg);border:0.5px solid var(--purple-bdr);color:var(--purple);font-size:11px;font-weight:500}
.usdc-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:var(--teal-bg);border:0.5px solid var(--teal-bdr);color:var(--teal);font-size:11px;font-weight:500}

/* KEYPAD */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px}
.key-btn{padding:12px;border-radius:var(--r);background:var(--bg2);border:0.5px solid var(--bdr);font-size:16px;font-weight:500;cursor:pointer;text-align:center;transition:background 0.1s}
.key-btn:active{background:var(--bg3)}

/* PIN DOTS */
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bdr2);background:transparent;transition:all 0.2s;flex-shrink:0}
.pin-dot.filled{background:var(--info);border-color:var(--info)}

/* VAM NODE */
.vam-node{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--r);padding:10px 12px;text-align:center}
.vam-flow{display:grid;gap:6px}
.vam-arrow{text-align:center;color:var(--text3);font-size:12px}
.check-step{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}

/* WALLET CARD */
.wallet-card{border-radius:var(--rl);padding:16px;margin:12px;position:relative;overflow:hidden;border:0.5px solid var(--bdr2)}

/* FLOW GRID */
.flow3{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;gap:8px;align-items:start}
.flow2{display:grid;grid-template-columns:1fr 28px 1fr;gap:8px;align-items:start}
.flow-col{border:0.5px solid var(--bdr);border-radius:var(--rl);padding:14px;transition:all 0.4s}
.f-arrow{display:flex;justify-content:center;padding-top:50px}
.stage-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 16px;background:var(--bg2);border-radius:var(--r)}
.s-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;border:0.5px solid var(--bdr);flex-shrink:0;transition:all 0.3s}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

/* ─── Constants ─── */
const SCREENS=[
  {id:'donor',   label:'Donor + USDC',       icon:'ti-building-bank', steps:[1,2]},
  {id:'wfp',     label:'WFP aid setup',      icon:'ti-settings',      steps:[6]},
  {id:'enroll',  label:'Agent enrolment',    icon:'ti-device-mobile', steps:[3,4]},
  {id:'merchant',label:'Merchant app',       icon:'ti-shopping-cart', steps:[5,7]},
  {id:'vam',     label:'SmartVista VAM',     icon:'ti-server',        steps:[8]},
  {id:'cashout', label:'Merchant cashout',   icon:'ti-cash',          steps:[9,10]},
  {id:'fraud',   label:'Fraud monitoring',   icon:'ti-shield-x',      steps:[11]},
  {id:'algo',    label:'Algorand audit',     icon:'ti-link',          steps:[12]},
  {id:'dash',    label:'Donor dashboard',    icon:'ti-chart-bar',     steps:[13]},
];

const TL_STEPS=[
  {n:1,lbl:'Donor funds'},{n:2,lbl:'Settlement'},{n:3,lbl:'Enrolment'},{n:4,lbl:'NFC card'},
  {n:5,lbl:'Merchant'},{n:6,lbl:'Disbursement'},{n:7,lbl:'Redemption'},{n:8,lbl:'Settlement'},
  {n:9,lbl:'Cashout'},{n:10,lbl:'Liquidity'},{n:11,lbl:'Fraud mon.'},{n:12,lbl:'Algorand'},{n:13,lbl:'Reporting'},
];

const INIT_LEDGER=[
  {hash:'7X2KP...9M4QR',id:'SO-BDO-4821',m:'Yusuf Ahmed',amt:'$25',t:'09:47:23',ok:true,ev:'redemption'},
  {hash:'FUND-WALLET-BATCH',id:'WFP-BATCH-001',m:'VAM engine',amt:'$600,000',t:'09:30:00',ok:true,ev:'disbursement'},
  {hash:'3T8NF...2L7VW',id:'SO-BDO-3104',m:'Hodan Ali',amt:'$50',t:'09:45:11',ok:true,ev:'redemption'},
  {hash:'FRAUD-4803',id:'SO-BDO-4803',m:'Yusuf Ahmed',amt:'$0',t:'09:41:30',ok:false,ev:'fraud_blocked'},
  {hash:'ENROLL-4821',id:'SO-BDO-4821',m:'Agent: Abdi',amt:'$0',t:'09:20:00',ok:true,ev:'enrolment'},
];

const sc=s=>s>=85?'var(--ok)':s>=60?'var(--warn)':'var(--err)';
const sb=s=>s>=85?'var(--ok-bg)':s>=60?'var(--warn-bg)':'var(--err-bg)';

/* ─── Shared Components ─── */
function M({label,value,icon,color}){
  return(
    <div className="metric">
      <div className="metric-lbl"><i className={`ti ${icon}`} style={{fontSize:14,color:color||'var(--text2)'}} aria-hidden="true"/>{label}</div>
      <div className="metric-val" style={{color:color||'var(--text)'}}>{value}</div>
    </div>
  );
}
function Pill({text,color,bg}){return <span className="pill" style={{background:bg||'var(--bg2)',color:color||'var(--text2)'}}>{text}</span>}
function Ring({score,size=88,stroke=7}){
  const r=(size-stroke*2)/2,c=2*Math.PI*r,p=score/100;
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bdr)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={sc(score)} strokeWidth={stroke}
        strokeDasharray={`${(c*p).toFixed(1)} ${(c*(1-p)).toFixed(1)}`} strokeLinecap="round" style={{transition:'stroke-dasharray 0.9s'}}/>
    </svg>
  );
}
function Arrow({active}){return <div className="f-arrow"><i className="ti ti-arrow-right" style={{fontSize:18,color:active?'var(--ok)':'var(--text3)'}} aria-hidden="true"/></div>}
function CheckStep({done,active,text}){
  return(
    <div className="check-step">
      <i className={`ti ${done?'ti-circle-check':active?'ti-loader-2':'ti-circle'} ${active?'spin':''}`}
        style={{fontSize:14,color:done?'var(--ok)':active?'var(--info)':'var(--text3)',flexShrink:0}} aria-hidden="true"/>
      <span style={{color:done?'var(--text)':active?'var(--text)':'var(--text3)'}}>{text}</span>
    </div>
  );
}

/* ─── SCREEN 1: Donor + USDC ─── */
function DonorScreen(){
  const [stage,setStage]=useState(0);
  const [count,setCount]=useState(600000);
  const [running,setRunning]=useState(false);
  const run=async()=>{
    setRunning(true);
    await new Promise(r=>setTimeout(r,900));setStage(1);
    await new Promise(r=>setTimeout(r,1200));setStage(2);
    await new Promise(r=>setTimeout(r,900));setStage(3);
    setRunning(false);
  };
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        <M label="Donor funds (USD)" value="$600,000" icon="ti-building-bank" color="var(--info)"/>
        <M label="USDC on Algorand" value={stage>=2?'$600,000':'Pending'} icon="ti-coin" color={stage>=2?'var(--teal)':'var(--text3)'}/>
        <M label="Smart contract" value={stage>=3?'Funded':'Awaiting'} icon="ti-link" color={stage>=3?'var(--purple)':'var(--text3)'}/>
        <M label="Beneficiaries covered" value="12,000" icon="ti-users"/>
      </div>

      {/* Stage controls */}
      <div className="stage-bar">
        {['USD held','Convert to USDC','Fund Algorand contract','Live & ready'].map((l,i)=>(
          <React.Fragment key={i}>
            <div className="s-dot" style={{background:stage>i?'var(--ok-bg)':stage===i?'var(--info-bg)':'var(--bg)',borderColor:stage>i?'var(--ok-bdr)':stage===i?'var(--info-bdr)':'var(--bdr)',color:stage>i?'var(--ok)':stage===i?'var(--info)':'var(--text3)'}}>
              {stage>i?<i className="ti ti-check" style={{fontSize:10}} aria-hidden="true"/>:i+1}
            </div>
            {i<3&&<div style={{flex:1,height:1,background:stage>i?'var(--ok-bdr)':'var(--bdr)'}}/>}
          </React.Fragment>
        ))}
        <div style={{marginLeft:'auto',display:'flex',gap:8}}>
          <button onClick={()=>{setStage(0);setRunning(false);}} disabled={running||stage===0} style={{fontSize:12}}>Reset</button>
          <button onClick={run} disabled={running||stage>0} style={{fontSize:13,fontWeight:500}}><i className="ti ti-player-play" aria-hidden="true"/> Fund via Algorand</button>
        </div>
      </div>

      <div className="flow3">
        {/* Donor */}
        <div className="flow-col" style={{borderColor:stage>=1?'var(--info-bdr)':'var(--bdr)',background:stage>=1?'var(--info-bg)':'var(--bg)'}}>
          <div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.06em',color:'var(--text3)',marginBottom:12}}>WFP / donor treasury</div>
          <div style={{textAlign:'center',padding:'12px 0'}}>
            <i className="ti ti-building-bank" style={{fontSize:48,color:'var(--info)'}} aria-hidden="true"/>
            <div style={{fontSize:15,fontWeight:500,marginTop:10}}>WFP / ECHO</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>USD held in treasury account</div>
          </div>
          <div style={{marginTop:10}}>
            {[['Fund source','ECHO EU Humanitarian'],['Currency','USD → USDC'],['Amount','$600,000'],['Cycle','December 2025 · Baidoa']].map(([k,v])=>(
              <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'0.5px solid var(--bdr)',fontSize:12}}>
                <span style={{color:'var(--text2)'}}>{k}</span><span style={{fontWeight:500}}>{v}</span>
              </div>
            ))}
          </div>
          {stage>=1&&<div className="fade-up" style={{marginTop:12,padding:'8px',background:'var(--ok-bg)',borderRadius:8,fontSize:12,color:'var(--ok)',textAlign:'center'}}><i className="ti ti-check" aria-hidden="true"/> $600K authorised for USDC conversion</div>}
        </div>

        <Arrow active={stage>=2}/>

        {/* Algorand USDC */}
        <div className="flow-col" style={{borderColor:stage>=2?'var(--purple-bdr)':'var(--bdr)',background:stage>=2?'var(--purple-bg)':'var(--bg)'}}>
          <div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.06em',color:'var(--text3)',marginBottom:12}}>Algorand — USDC smart contract</div>
          <div style={{textAlign:'center',padding:'12px 0'}}>
            <i className="ti ti-link" style={{fontSize:48,color:'var(--purple)'}} aria-hidden="true"/>
            <div style={{fontSize:15,fontWeight:500,marginTop:10,color:'var(--purple)'}}>Algorand blockchain</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>USDC smart contract</div>
          </div>
          {stage>=2?<div className="slide-r">
            {[['Contract address','ALGO-SOMNEXUS-BDO-2025-12'],['USDC locked','$600,000.00'],['Release trigger','SmartVista verified tx event'],['Condition','fingerprint_match = TRUE'],['Funds per beneficiary','$50/cycle (configurable)']].map(([k,v])=>(
              <div key={k} style={{display:'flex',gap:10,padding:'5px 0',borderBottom:'0.5px solid var(--purple-bdr)',fontSize:11}}>
                <span style={{color:'var(--purple)',minWidth:120,flexShrink:0}}>{k}</span>
                <span style={{color:'var(--purple)',fontWeight:500,fontFamily:'monospace',wordBreak:'break-all'}}>{v}</span>
              </div>
            ))}
          </div>:<div style={{fontSize:12,color:'var(--text3)',textAlign:'center',padding:'20px 0'}}>Awaiting USDC transfer...</div>}
        </div>

        <Arrow active={stage>=3}/>

        {/* SmartVista VAM */}
        <div className="flow-col" style={{borderColor:stage>=3?'var(--ok-bdr)':'var(--bdr)',background:stage>=3?'var(--ok-bg)':'var(--bg)'}}>
          <div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.06em',color:'var(--text3)',marginBottom:12}}>SmartVista VAM engine</div>
          <div style={{textAlign:'center',padding:'12px 0'}}>
            <i className="ti ti-server" style={{fontSize:48,color:stage>=3?'var(--ok)':'var(--text3)'}} aria-hidden="true"/>
            <div style={{fontSize:15,fontWeight:500,marginTop:10}}>SmartVista VAM</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>Virtual account management</div>
          </div>
          {stage>=3?<div className="fade-up">
            {[['Beneficiary wallets','12,000 created'],['Merchant wallets','47 active'],['Rules engine','Food only · max $100/month'],['Settlement bank','Somali settlement bank'],['Algorand sync','Live event listener active']].map(([k,v])=>(
              <div key={k} style={{display:'flex',gap:10,padding:'5px 0',borderBottom:'0.5px solid var(--ok-bdr)',fontSize:11}}>
                <span style={{color:'var(--ok)',minWidth:130,flexShrink:0}}>{k}</span>
                <span style={{color:'var(--ok)',fontWeight:500}}>{v}</span>
              </div>
            ))}
          </div>:<div style={{fontSize:12,color:'var(--text3)',textAlign:'center',padding:'20px 0'}}>Awaiting Algorand funding...</div>}
        </div>
      </div>
    </div>
  );
}

/* ─── SCREEN 2: WFP Admin ─── */
function WFPScreen(){
  const [loaded,setLoaded]=useState(false);
  const [count,setCount]=useState(0);
  useEffect(()=>{if(loaded){const t=setInterval(()=>setCount(c=>{if(c>=12000){clearInterval(t);return 12000;}return c+120;}),30);return()=>clearInterval(t);}},[loaded]);
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:18}}>
        <M label="Beneficiary wallets" value={loaded?count.toLocaleString():'—'} icon="ti-users" color={loaded?'var(--ok)':'var(--text3)'}/>
        <M label="Funds loaded per wallet" value="$50 / month" icon="ti-coin"/>
        <M label="Rules applied" value="3 active rules" icon="ti-shield-check" color="var(--info)"/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <div className="card">
          <div className="card-hd"><i className="ti ti-adjustments" style={{fontSize:14,color:'var(--info)'}} aria-hidden="true"/>Aid disbursement rules</div>
          <div className="card-bd">
            {[
              {rule:'Category restriction',val:'Food & nutrition only',ok:true},
              {rule:'Monthly cap per household',val:'$100 maximum',ok:true},
              {rule:'Merchant whitelist',val:'WFP-verified merchants only',ok:true},

/* ─── Timeline ─── */
function Timeline({activeSteps}){
  return(
    <div className="timeline">
      {TL_STEPS.map((s,i)=>(
        <div key={s.n} className="tl-step">
          <div className="tl-item">
            <div className={`tl-dot${activeSteps.includes(s.n)?' tl-active':''}`}>{s.n}</div>
            <div className="tl-label" style={{color:activeSteps.includes(s.n)?'var(--info)':'var(--text3)'}}>{s.lbl}</div>
          </div>
          {i<TL_STEPS.length-1&&<div className="tl-line"/>}
        </div>
      ))}
    </div>
  );
}

/* ─── Root App ─── */
function App(){
  const [screen,setScreen]=useState('donor');
  const [auto,setAuto]=useState(false);
  const [autoIdx,setAutoIdx]=useState(0);
  const cur=SCREENS.find(s=>s.id===screen)||SCREENS[0];

  useEffect(()=>{
    if(!auto)return;
    const ids=SCREENS.map(s=>s.id);
    const t=setInterval(()=>{
      setAutoIdx(i=>{const n=(i+1)%ids.length;setScreen(ids[n]);return n;});
    },6500);
    return()=>clearInterval(t);
  },[auto]);

  return(
    <div>
      <div className="topbar">
        <div style={{width:32,height:32,borderRadius:8,background:'var(--info-bg)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <i className="ti ti-shield-check" style={{fontSize:18,color:'var(--info)'}} aria-hidden="true"/>
        </div>
        <div>
          <span style={{fontWeight:500,fontSize:15}}>Somnexus</span>
          <span style={{color:'var(--text3)',fontSize:12,marginLeft:8}}>× Algorand × SmartVista VAM · WFP Somalia · Phase 1 demo</span>
        </div>
        <div style={{flex:1}}/>
        <span className="pulse" style={{width:7,height:7,borderRadius:'50%',background:'var(--ok)',display:'inline-block',marginRight:6}}/>
        <span style={{fontSize:12,color:'var(--text3)',marginRight:14}}>12,000 beneficiaries · Baidoa · live</span>
        <button onClick={()=>setAuto(a=>!a)} style={{fontSize:13}}>
          {auto?<><i className="ti ti-player-stop" aria-hidden="true"/> Stop auto-play</>:<><i className="ti ti-player-play" aria-hidden="true"/> Auto-play demo</>}
        </button>
      </div>

      <Timeline activeSteps={cur.steps}/>

      <div className="layout">
        <div className="sidebar">
          {SCREENS.map((s,i)=>(
            <div key={s.id} className={`nav-item${screen===s.id?' active':''}`} onClick={()=>{setScreen(s.id);setAuto(false);}}>
              <i className={`ti ${s.icon}`} style={{fontSize:15,color:screen===s.id?'var(--info)':'var(--text2)'}} aria-hidden="true"/>
              <span style={{fontSize:12,color:screen===s.id?'var(--info)':'var(--text2)',fontWeight:screen===s.id?500:400}}>{s.label}</span>
            </div>
          ))}
          {auto&&(
            <div style={{margin:'14px 12px',padding:'10px',background:'var(--bg)',border:'0.5px solid var(--bdr2)',borderRadius:8}}>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>Screen {autoIdx+1} / {SCREENS.length}</div>
              <div style={{height:3,background:'var(--bdr)',borderRadius:2}}>
                <div style={{height:'100%',width:`${((autoIdx+1)/SCREENS.length)*100}%`,background:'var(--info)',borderRadius:2,transition:'width 0.5s'}}/>
              </div>
            </div>
          )}
        </div>
        <div className="content">
          {screen==='donor'   &&<DonorScreen/>}
          {screen==='wfp'     &&<WFPScreen/>}
          {screen==='enroll'  &&<EnrolScreen/>}
          {screen==='merchant'&&<MerchantScreen/>}
          {screen==='vam'     &&<VAMScreen/>}
          {screen==='cashout' &&<CashoutScreen/>}
          {screen==='fraud'   &&<FraudScreen/>}
          {screen==='algo'    &&<AlgoScreen/>}
          {screen==='dash'    &&<DashScreen/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
